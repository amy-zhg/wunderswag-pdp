<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Wunderswag Product Page</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/utilities.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  </head>
  <body>
    <!--   Navigation Bar  -->
    <header>
      <nav class="container">
        <a href="#" id="logo">
          <img
            src="https://cdn.glitch.global/72d64529-259e-46bc-aad9-2e7a3ffefb7e/wknd-favicon-blk.svg?v=1647759275149"
            alt="Wunderkind"
          /><span>underswag</span>
        </a>

        <ul>
          <li><a href="#">Shop</a></li>
          <li><a href="#">Wishlist</a></li>
          <li><a href="#">Account</a></li>
          <li>
            <a href="#" id="cart-icon"
              ><img
                src="https://cdn.glitch.global/bad4a18c-c673-4484-9ae2-c2bab6d3f58a/blk-shopping-cart.svg?v=1647925148534"
                alt="cart"
              />
              <div id="cart-qty">0</div>
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <!--     <div id="wave">
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewbox="0 0 1440 160.8" xml:space="preserve"><g><path fill="red" d="M1440.3,35.6c-97.8,38.9-242.9,75-443.3,74.9c-71,0-149.1-4.6-234.7-15.2L-0.3,0v160.8h1440.7"></path></g></svg>
        </div> -->

    <!--  Main -->
    <section class="main container">
      <div class="product-container">
        <div class="image-container">
          <img
            src="https://source.unsplash.com/400x400/?stationery"
            class="item main-image"
          />
          <div class="secondary-image">
            <img
              src="https://cdn.glitch.global/935c1b3a-2d6f-42b5-aab8-2ea9c89cca70/tote.jpg?v=1646371586198"
              class="item sec item-1 active"
            />
            <img
              src="https://source.unsplash.com/100x100/?greencolor"
              class="item sec item-2"
            />
            <img
              src="https://source.unsplash.com/100x100/?red"
              class="item sec item-3"
            />
            <img
              src="https://source.unsplash.com/100x100/?yellow"
              class="item sec item-4"
            />
          </div>
        </div>
        <div class="product-info">
          <h1>Product Name</h1>
          <p>Product description goes here two line product description</p>
          <h3>Color</h3>
          <div class="color-swatches">
            <img src="color-swatch.svg" class="swatch color-1" />
            <img src="color-swatch.svg" class="swatch color-2" />
            <img src="color-swatch.svg" class="swatch color-3" />
            <img src="color-swatch.svg" class="swatch color-4" />
          </div>
          <h3>Quantity</h3>
          <div class="quantity">
            <!-- <svg>
              <ellipse cx="35" cy="35" rx="35" ry="35" />
            </svg> -->

            <img
              src="https://cdn.glitch.global/935c1b3a-2d6f-42b5-aab8-2ea9c89cca70/minus-circle.svg?v=1645435804825"
              id="minus-icon"
            />

            <h2 id="quantity-value">1</h2>
            <img
              src="https://cdn.glitch.global/935c1b3a-2d6f-42b5-aab8-2ea9c89cca70/plus-circle.svg?v=1645435811670"
              id="plus-icon"
            />
          </div>

          <button class="btn-primary add-to-cart-btn">Add to Cart</button>
        </div>
      </div>
    </section>

    <!--   Browser Similar Items -->
    <section class="recs container">
      <h1 class="slider-title">Browser Similar Items</h1>
      <section class="slider container">
        <a class="arrow" id="slideLeft">&#10094;</a>

        <div class="image-slider">
          <img src="https://source.unsplash.com/175x375/?pencil" />
          <img src="https://source.unsplash.com/175x375/?pen" />
          <img src="https://source.unsplash.com/175x375/?stationary" />
          <img src="https://source.unsplash.com/175x375/?tote" />
          <img src="https://source.unsplash.com/175x375/?pencil" />
          <img src="https://source.unsplash.com/175x375/?pen" />
          <img src="https://source.unsplash.com/175x375/?totebag" />
          <img src="https://source.unsplash.com/175x375/?notepad" />
        </div>
        <a class="arrow" id="slideRight">&#10095;</a>
      </section>
    </section>

    <!-- import the webpage's javascript file -->
    <script src="/script.js"></script>
  </body>
</html>
